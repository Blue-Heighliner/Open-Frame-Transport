syntax = "proto3";

package oft;

option csharp_namespace = "BlueHeighliner.OpenFrameTransport.Proto";

// Sent immediately after the TLS session is established (or, with TLS
// disabled, immediately after the raw TCP connection is formed - see
// Docs/OFT.md §9), by both sides, without waiting for the peer. A connection
// is established once a side has received the peer's hail. The first
// message read on a connection is always a Hail; every message after it is
// a Packet. See Docs/OFT.md §2-§3.
message Hail {
  // The OFT protocol version string of the sender, e.g. "oft/1".
  string version = 1;

  // Opaque, application-controlled data exchanged during connection setup.
  string info = 2;
}

// A single unit of the OFT packet protocol described in Docs/OFT.md §4. Every
// message after the initial Hail is a Packet.
message Packet {
  // 0 = Completion, 1 = Cancellation, 2 = Receipt, 3 = Unit,
  // >=4 = Data on priority channel (control - 4). Rekeying (Docs/OFT.md §8) has
  // no control value of its own - it's a TLS 1.3 KeyUpdate, invisible at this
  // layer entirely.
  //
  // Completion is deliberately the value that coincides with proto3's default
  // (and therefore the one value plain default-value omission could ever
  // elide): a Completion packet is only ever the final chunk of a message too
  // large to fit in one packet (see Docs/OFT.md §4), so its `data` field is
  // always non-empty and alone always forces a nonzero-length frame even when
  // `control` itself goes unwritten, keeping it from ever colliding with
  // Poll's bare zero-length frame (Docs/OFT.md §4, §10). Every other control
  // value is itself nonzero, which forces serialization independent of
  // `data`.
  uint32 control = 1;

  // Payload bytes. Empty for Receipt and Cancellation; never empty for Completion.
  bytes data = 2;
}
