syntax = "proto3";

package oft;

option csharp_namespace = "OpenFrameTransport.Proto";

// Sent immediately after the TLS session is established (or, with TLS
// disabled, immediately after the raw TCP connection is formed - see
// Docs/OFT.md §9), by both sides, without waiting for the peer. A connection
// is established once a side has received the peer's hail. The first
// message read on a connection is always a Hail; every message after it is
// a Packet. See Docs/OFT.md §2-§3.
message Hail {
  // The OFT protocol version string of the sender, e.g. "oft/1".
  string version = 1;

  // Opaque, application-controlled data exchanged during connection setup.
  string info = 2;
}

// A single unit of the OFT packet protocol described in Docs/OFT.md §4. Every
// message after the initial Hail is a Packet.
message Packet {
  // 0 = Receipt, 1 = Unit, 2 = Completion, 3 = Cancellation,
  // >=4 = Data on priority channel (control - 4). Rekeying (Docs/OFT.md §8) has
  // no control value of its own - it's a TLS 1.3 KeyUpdate, invisible at this
  // layer entirely.
  //
  // Declared `optional` (proto3 explicit field presence) purely so that
  // `control = 0` (Receipt) still serializes to a nonzero-length frame: without
  // presence tracking, proto3 never emits a field tag for a default value, so
  // a Receipt (control = 0, data empty) would serialize identically to Poll's
  // bare zero-length frame (see Docs/OFT.md §4 and §10) - two different, both
  // legitimately-sent things becoming indistinguishable on the wire. With
  // presence tracking, setting `control` explicitly (to any value, including
  // 0) always emits its tag, so only a Packet with control genuinely *absent*
  // - which this codebase never constructs - would collide with Poll, and
  // Poll is written as its own dedicated zero-length frame rather than ever
  // going through Packet's encoder in the first place.
  optional uint32 control = 1;

  // Payload bytes. Empty for Receipt and Cancellation.
  bytes data = 2;
}
